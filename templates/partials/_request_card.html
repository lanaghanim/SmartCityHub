<div class="card request-card h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <div>
                <span class="category-chip">{{ req.get_category_display }}</span>
                <h5 class="card-title mt-2 mb-1">{{ req.title }}</h5>
            </div>
            <span class="badge status-badge status-{{ req.status }}">{{ req.get_status_display }}</span>
        </div>
        <p class="text-muted small mb-0">{{ req.description|truncatechars:180 }}</p>
        <div class="meta-row">
            <span><i class="bi bi-geo-alt"></i>{{ req.location }}</span>
            <span><i class="bi bi-calendar3"></i>{{ req.created_at|date:"M j, Y" }}</span>
            {% if req.assigned_to %}
                <span><i class="bi bi-person-check"></i>Assigned to {{ req.assigned_to.username }}</span>
            {% endif %}
        </div>
    </div>
</div>
