{% extends 'base.html' %}

{% block title %}Login — SmartCity Hub{% endblock %}

{% block content %}
<div class="container auth-wrap">
    <div class="card auth-card">
        <div class="auth-head">
            <span class="brand-mark"><i class="bi bi-buildings"></i></span>
            <h1>Welcome back</h1>
            <p>Sign in to manage your requests and discover city events.</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-icon">
                        <i class="bi bi-person"></i>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="Your username" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-icon">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
                </button>
            </form>

            <p class="auth-switch mt-4 mb-0">
                New to SmartCity Hub? <a href="{% url 'register' %}">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
